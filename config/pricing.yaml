version: pricing-v2
currency: NGN

affordability:
  max_share_of_annual_income: 0.05     # annual premium must be <= 5% of yearly income
  source: illustrative

compulsory_products: [MTP]             # legally required: never hidden for affordability

products:
  MTP:
    source: "NAICOM circular NAICOM/DPR/CIR/46/2022, effective 2023-01-01"
    tariff: {Saloon Car: 15000, SUV: 15000, Bus: 20000, Tricycle: 5000, Motorcycle: 3000}

  MCP:
    source: "NAICOM circular NAICOM/DPR/CIR/46/2022 (minimum rate after rebates)"
    min_rate: 0.05

  HIN:
    source: illustrative
    base: 60000
    smoker_loading: 0.25

  HFM:
    source: illustrative
    principal: 60000
    per_dependent: 40000
    max_dependents: 5
    smoker_loading: 0.25

  TRV:
    source: illustrative
    per_trip: 30000
    senior_age: 60
    senior_loading: 1.0

  HCN:
    source: illustrative
    building_rate: 0.0015
    contents_months_income: 6
    contents_rate: 0.005
    minimum: 10000

  SHP:
    source: illustrative
    stock_months_income: 4
    rate: 0.01
    minimum: 15000

  HMC:
    source: "benchmark: Lagos State Ilera Eko Standard Jaara plan (2024 onwards)"
    individual: 15000
    family_4: 55000
    family_6: 80000
    extra_dependent: 10000

# Health age factors: (min age, max age, multiplier)
health_age_bands:
  source: illustrative
  bands:
    - [0, 30, 0.8]
    - [31, 45, 1.0]
    - [46, 60, 1.4]
    - [61, 200, 2.0]