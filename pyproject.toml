[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-core"
version = "0.1.0"
description = "ML insurance recommendation and automated policy issuance for the Nigerian market"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "reportlab>=4.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
backend = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",     # Postgres driver for a real deployment; SQLite needs none of this
]

[tool.setuptools.packages.find]
include = ["insurance_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # lets tests import the backend package from the project root
filterwarnings = [
    # Deprecation notices from inside Starlette's test client (library code, not ours)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]