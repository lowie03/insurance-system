[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-core"
version = "0.1.0"
description = "ML insurance recommendation and automated policy issuance for the Nigerian market"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "reportlab>=4.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["insurance_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]